name: build-log

# Redraws assets/build-log-*.svg from the public contribution calendar once a day.
# On pull requests it only fetches and prints the numbers, so the token path is tested.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/build-log.yml"

permissions:
  contents: read

concurrency:
  group: build-log-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/build_log.py --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/build_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when the log changed
        run: |
          if git diff --quiet -- assets/build-log-dark.svg assets/build-log-light.svg; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/build-log-dark.svg assets/build-log-light.svg
          git commit -m "chore: refresh build log"
          git push
